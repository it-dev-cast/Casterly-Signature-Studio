server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    # Headers passed to the FastAPI container on every proxied route. X-Forwarded-*
    # arriving from the host nginx are kept so the backend sees the real client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API and uploaded images are served by the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    location /banner/ {
        proxy_pass http://backend:8000;
    }

    # Public backend pages: Outlook add-in files and employee setup links.
    location /outlook-addin/ {
        proxy_pass http://backend:8000;
    }

    location /setup/ {
        proxy_pass http://backend:8000;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
