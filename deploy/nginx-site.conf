# Only for a server with NO existing port-80 site. Install as /etc/nginx/sites-available/signature-studio.
# If another site already serves port 80, don't use this file. Add the include line to that site instead.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/signature-studio.conf;

    location = / {
        return 302 /signature/;
    }
}
