# Signature Studio at http://<server>/signature/ .
# Install as /etc/nginx/snippets/signature-studio.conf and `include` it inside the server { }
# block that listens on port 80 (see DEPLOY.md, Phase M).
#
# The /signature prefix is stripped before reaching the frontend container, whose nginx
# serves the SPA and forwards /api, /uploads, /static, /banner, /outlook-addin and /setup to the API.

location = /signature {
    return 301 /signature/;
}

location ^~ /signature/ {
    proxy_pass http://127.0.0.1:8280/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /signature;
    client_max_body_size 10M;
}
