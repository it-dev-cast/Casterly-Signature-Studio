# Production stack for the Ubuntu server. Copy to /opt/signature-studio/compose.yaml
# (the source checkout lives next to it in /opt/signature-studio/app).
#
# PostgreSQL stays on the private network. API and frontend bind to 127.0.0.1 only;
# the host nginx publishes the frontend at http://192.168.0.190/signature/.
# Secrets come from /opt/signature-studio/.env.

name: signature-studio

services:
  postgres:
    image: postgres:17
    container_name: signature-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing from .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing from .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - signature_studio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    image: signature-studio-api
    container_name: signature-studio-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      # nexusAuth employee sync: nexusAuth is published by the host nginx on port 8300.
      - "host.docker.internal:host-gateway"
    ports:
      # 8200 is taken by nexusAuth on this server.
      - "127.0.0.1:8210:8000"
    networks:
      signature_studio_internal:
        # frontend/nginx.conf proxies to http://backend:8000
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Public gateway: ONLY what Outlook and email recipients need (add-in files, signatures by
  # email, live banner, logo, uploaded images, setup page). No login or admin API.
  # The public HTTPS hostname (Cloudflare Tunnel) points here, never at the frontend/API.
  public:
    image: signature-studio-api
    container_name: signature-studio-public
    restart: unless-stopped
    command: ["uvicorn", "app.public_app:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8201:8001"
    networks:
      - signature_studio_internal

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        # Must match the nginx location and the path in PUBLIC_BASE_URL.
        BASE_PATH: /signature
    image: signature-studio-frontend
    container_name: signature-studio-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8280:80"
    networks:
      - signature_studio_internal

networks:
  signature_studio_internal:
    driver: bridge

volumes:
  postgres_data:
  uploads:
